{% extends 'base.html' %}
{% block title %}Supprimer{% endblock %}
{% block content %}
<div class="page-header"><h3 class="mb-0"><i class="bi bi-trash"></i> Supprimer le Produit</h3></div>
<div class="card shadow-sm" style="max-width:450px;"><div class="card-body text-center py-4">
  <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:50px;"></i>
  <h5 class="mt-3">Supprimer <strong>{{ product.name }}</strong> ?</h5>
  <p class="text-muted">Cette action est irreversible.</p>
  <form method="post" class="d-flex gap-2 justify-content-center">{% csrf_token %}
    <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Oui, supprimer</button>
    <a href="{% url 'product_list' %}" class="btn btn-outline-secondary">Annuler</a>
  </form>
</div></div>{% endblock %}
