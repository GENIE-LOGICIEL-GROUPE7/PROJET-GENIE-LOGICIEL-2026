{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header"><h3 class="mb-0"><i class="bi bi-plus-circle"></i> {{ title }}</h3></div>
<div class="card shadow-sm" style="max-width:480px;"><div class="card-body">
<form method="post">{% csrf_token %}
  <div class="mb-3"><label class="form-label fw-semibold">Nom de l'article *</label>{{ form.item_name }}</div>
  <div class="row g-3 mb-3">
    <div class="col-md-6"><label class="form-label fw-semibold">Quantite *</label>{{ form.quantity }}</div>
    <div class="col-md-6"><label class="form-label fw-semibold">Unite *</label>{{ form.unit }}</div>
  </div>
  <div class="mb-3"><label class="form-label fw-semibold">Seuil critique</label>{{ form.threshold }}</div>
  <div class="mb-3"><label class="form-label fw-semibold">Produit lie (optionnel)</label>{{ form.product }}</div>
  {% if form.errors %}<div class="alert alert-danger">{{ form.errors }}</div>{% endif %}
  <div class="d-flex gap-2 mt-4">
    <button type="submit" class="btn btn-navy text-white"><i class="bi bi-check-circle"></i> Enregistrer</button>
    <a href="{% url 'stock_list' %}" class="btn btn-outline-secondary">Annuler</a>
  </div>
</form>
</div></div>{% endblock %}
