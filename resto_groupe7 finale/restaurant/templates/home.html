{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bienvenue - Restaurant Groupe 7</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#1A5276 0%,#2E86C1 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card-home{background:rgba(255,255,255,0.97);border-radius:20px;padding:50px 40px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.logo-icon{font-size:70px;color:#1A5276;}
</style>
</head>
<body>
<div class="card-home">
  <div class="logo-icon"><i class="bi bi-shop-window"></i></div>
  <h1 style="color:#1A5276;font-weight:800;font-size:2rem;" class="mt-2">Restaurant Groupe 7</h1>
  <p class="text-muted">Yaoundé — ENSPY 2025-2026<br><small>Restaurant Management System — GTEL 3046</small></p>
  <div class="d-flex gap-3 justify-content-center mt-4 flex-wrap">
    <a href="{% url 'menu' %}" class="btn btn-success btn-lg px-4 fw-bold text-white rounded-3">
      <i class="bi bi-person"></i> Je suis un Client
    </a>
    {% if user.is_authenticated %}
    <a href="{% url 'dashboard' %}" class="btn btn-primary btn-lg px-4 fw-bold text-white rounded-3" style="background:#1A5276;border-color:#1A5276;">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    {% else %}
    <a href="{% url 'login' %}" class="btn btn-primary btn-lg px-4 fw-bold text-white rounded-3" style="background:#1A5276;border-color:#1A5276;">
      <i class="bi bi-shield-lock"></i> Espace Admin
    </a>
    {% endif %}

  </div>
  <p class="mt-4 text-muted small"><i class="bi bi-info-circle"></i> Supervision: Mr. MBIETIEU Amos</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
