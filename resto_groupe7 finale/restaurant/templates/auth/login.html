<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Connexion - RMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#1A5276,#2E86C1);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card-login{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,0.2);}
</style>
</head>
<body>
<div class="card-login">
  <div class="text-center mb-4">
    <i class="bi bi-shield-lock" style="font-size:50px;color:#1A5276;"></i>
    <h2 style="color:#1A5276;font-weight:700;" class="mt-2">Connexion</h2>
    <p class="text-muted small">Restaurant Groupe 7 — RMS</p>
  </div>
  {% if messages %}{% for msg in messages %}<div class="alert alert-danger"><i class="bi bi-x-circle"></i> {{ msg }}</div>{% endfor %}{% endif %}
  <form method="post">{% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-semibold"><i class="bi bi-person"></i> Nom d'utilisateur</label>
      {{ form.username }}
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold"><i class="bi bi-lock"></i> Mot de passe</label>
      {{ form.password }}
    </div>
    <button type="submit" class="btn w-100 text-white fw-bold py-2 rounded-3" style="background:#1A5276;">
      <i class="bi bi-box-arrow-in-right"></i> Se Connecter
    </button>
  </form>
  <div class="text-center mt-3">
    <a href="{% url 'home' %}" class="text-muted small"><i class="bi bi-arrow-left"></i> Retour accueil</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
